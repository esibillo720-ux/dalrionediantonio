<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dal Rione di Antonio</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f4f4;color:#171717}header{background:#111;color:white;text-align:center;padding:24px}main{max-width:850px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card,.box{background:white;border-radius:18px;padding:16px;margin-bottom:14px}.qty{display:flex;align-items:center;gap:10px}.qty button{width:42px;height:42px;border:1px solid #ddd;border-radius:10px;background:white;font-size:22px}.qty span{min-width:25px;text-align:center;font-weight:bold}input,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin:6px 0 12px}.send{width:100%;padding:15px;border:0;border-radius:12px;background:#111;color:white;font-weight:bold;font-size:16px}.total{display:flex;justify-content:space-between;font-size:24px;font-weight:800}</style></head>
<body><header><h1>Dal Rione di Antonio</h1><p>La tua vetrina online</p></header><main><div id="products" class="grid"></div><div class="box"><h2>🛒 Il tuo ordine</h2><div id="cart">Nessun prodotto selezionato.</div><div class="total"><span>Totale</span><span id="total">0,00 €</span></div></div>
<div class="box"><h2>📦 Dati dell'ordine</h2><label>Nickname<input id="nickname" placeholder="Il tuo nickname"></label><label>Telefono<input id="phone" inputmode="tel" placeholder="Telefono"></label><label>Via / indirizzo<textarea id="address" rows="2" placeholder="Dove consegnare?"></textarea></label><button id="send" class="send">Invia ordine</button><p id="msg"></p></div></main>
<script>
const products=[["dry","Dry",0],["frozen","Frozen",0],["coco","Coco",0],["cali","Cali",0],["sprite","Sprite",2.5],["coca","Coca-Cola",1.5]],cart={};products.forEach(p=>cart[p[0]]=0);
const eur=n=>n.toLocaleString("it-IT",{style:"currency",currency:"EUR"});
function render(){document.getElementById("products").innerHTML=products.map(p=>`<div class="card"><h2>${p[1]}</h2><p>${p[2]?eur(p[2]):"Prezzo da impostare"}</p><div class="qty"><button onclick="change('${p[0]}',-1)">−</button><span>${cart[p[0]]}</span><button onclick="change('${p[0]}',1)">+</button></div></div>`).join("");let rows=products.filter(p=>cart[p[0]]),tot=rows.reduce((s,p)=>s+p[2]*cart[p[0]],0);document.getElementById("cart").innerHTML=rows.length?rows.map(p=>`<p>${p[1]} × ${cart[p[0]]} — ${eur(p[2]*cart[p[0]])}</p>`).join(""):"Nessun prodotto selezionato.";document.getElementById("total").textContent=eur(tot)}
function change(id,n){cart[id]=Math.max(0,cart[id]+n);render()}
document.getElementById("send").onclick=async()=>{let rows=products.filter(p=>cart[p[0]]),nickname=document.getElementById("nickname").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim(),msg=document.getElementById("msg");if(!rows.length||!nickname||!phone||!address){msg.textContent="Inserisci prodotti, nickname, telefono e indirizzo.";return}let total=rows.reduce((s,p)=>s+p[2]*cart[p[0]],0);try{let r=await fetch("/api/order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nickname,phone,address,items:rows.map(p=>({name:p[1],quantity:cart[p[0]],price:p[2]})),total})});if(!r.ok)throw 0;msg.textContent="✅ Ordine inviato!";}catch(e){msg.textContent="⚠️ Invio non disponibile: configura il collegamento Telegram."}};
render();
</script></body></html>
